name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:   # builds + smoke-tests the packages without publishing
  pull_request:        # ...and whenever packaging itself changes
    paths: ['.github/workflows/release.yml', '.github/workflows/rdkit.yml', 'CMakeLists.txt', 'THIRD_PARTY_LICENSES.md', 'cmake/**']

permissions:
  contents: write

jobs:
  macos:
    strategy:
      matrix:
        include:
          - {runner: macos-14, arch: arm64}          # Apple silicon
          - {runner: macos-15-intel, arch: x86_64}   # Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150   # 45 once RDKit comes from the cache
    env:
      RDKit_ROOT: '${{ github.workspace }}/rdkit-prefix'
      # Signing and notarizing run only once these secrets exist (packaging/SIGNING.md);
      # without them the app stays ad-hoc signed, as before.
      MACOS_CERTIFICATE: '${{ secrets.MACOS_CERTIFICATE }}'
      MACOS_CERTIFICATE_PASSWORD: '${{ secrets.MACOS_CERTIFICATE_PASSWORD }}'
      NOTARY_KEY: '${{ secrets.NOTARY_KEY }}'
      NOTARY_KEY_ID: '${{ secrets.NOTARY_KEY_ID }}'
      NOTARY_ISSUER_ID: '${{ secrets.NOTARY_ISSUER_ID }}'
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.10.0
        with: {cache: true}
      - uses: actions/cache@v4   # RDKit without its ChemDraw library (#233); see rdkit.yml
        id: rdkit
        with:
          path: rdkit-prefix
          key: rdkit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/build-rdkit.sh', 'pixi.lock') }}
      - if: steps.rdkit.outputs.cache-hit != 'true'
        shell: bash
        run: pixi run bash cmake/build-rdkit.sh rdkit-prefix
      - run: pixi run build
      - name: Bundle
        run: |
          mkdir dist && cp -R build/bin/penzene.app dist/
          pixi run macdeployqt6 dist/penzene.app -libpath="$PWD/rdkit-prefix/lib" -libpath="$PWD/.pixi/envs/default/lib"
          test -s dist/penzene.app/Contents/Resources/LICENSE
          test -s dist/penzene.app/Contents/Resources/THIRD_PARTY_LICENSES.md
          test -d dist/penzene.app/Contents/PlugIns/tls   # HTTPS for the PubChem lookups
          bash cmake/check-no-chemdraw.sh dist/penzene.app
          codesign --force --deep --sign - dist/penzene.app
      - name: Sign (Developer ID)
        if: env.MACOS_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          pass=$(uuidgen)
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | grep -m1 'Developer ID Application' | awk '{print $2}')
          [ -n "$identity" ] || { echo "no Developer ID Application identity in MACOS_CERTIFICATE"; exit 1; }
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          # Hardened runtime, which notarization requires. No entitlements: nothing here JITs,
          # and every bundled library is signed with the same identity.
          codesign --force --deep --options runtime --timestamp --sign "$identity" dist/penzene.app
          codesign --verify --deep --strict --verbose=2 dist/penzene.app
      - name: Smoke test and dmg
        run: |
          mv .pixi .pixi-hidden   # prove the bundle doesn't need the build env
          dist/penzene.app/Contents/MacOS/penzene --version
          dist/penzene.app/Contents/MacOS/penzene --render 'c1ccccc1O' smoke.svg
          mv .pixi-hidden .pixi
          # hdiutil sometimes finds the volume "Resource busy" on hosted runners; try again.
          for i in 1 2 3 4 5; do
            hdiutil create -volname "Penzene" -srcfolder dist -ov -format UDZO penzene-macos-${{ matrix.arch }}.dmg && break
            [ $i = 5 ] && exit 1
            sleep $((i * 10))
          done
      - name: Sign and notarize the dmg
        if: env.MACOS_CERTIFICATE != '' && env.NOTARY_KEY != ''
        run: |
          dmg=penzene-macos-${{ matrix.arch }}.dmg
          codesign --force --timestamp --sign "$SIGN_IDENTITY" "$dmg"
          echo "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          auth=(--key "$RUNNER_TEMP/notary.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID")
          xcrun notarytool submit "$dmg" "${auth[@]}" --wait --timeout 1h --output-format json | tee notary.json || true
          id=$(jq -r .id notary.json)
          if [ "$(jq -r .status notary.json)" != Accepted ]; then
            xcrun notarytool log "$id" "${auth[@]}"
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl -a -vv -t open --context context:primary-signature "$dmg"
      - name: Remove the signing keychain
        if: always() && env.MACOS_CERTIFICATE != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - uses: actions/upload-artifact@v4
        with: {name: 'macos-${{ matrix.arch }}', path: 'penzene-macos-${{ matrix.arch }}.dmg'}

  windows:
    runs-on: windows-2022
    timeout-minutes: 150   # 45 once RDKit comes from the cache
    env:
      RDKit_ROOT: '${{ github.workspace }}/rdkit-prefix'
      # Signing runs only once these secrets exist (packaging/SIGNING.md).
      WINDOWS_CERTIFICATE: '${{ secrets.WINDOWS_CERTIFICATE }}'
      WINDOWS_CERTIFICATE_PASSWORD: '${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}'
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.10.0
        with: {cache: true}
      - uses: actions/cache@v4   # RDKit without its ChemDraw library (#233); see rdkit.yml
        id: rdkit
        with:
          path: rdkit-prefix
          key: rdkit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/build-rdkit.sh', 'pixi.lock') }}
      - if: steps.rdkit.outputs.cache-hit != 'true'
        shell: bash
        run: pixi run bash cmake/build-rdkit.sh rdkit-prefix
      - run: pixi run build
      - name: Bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/penzene | Out-Null
          Copy-Item build/bin/penzene.exe dist/penzene/
          Copy-Item LICENSE,THIRD_PARTY_LICENSES.md dist/penzene/
          $qtpaths = (Get-ChildItem .pixi/envs/default/Library -Recurse -Filter "qtpaths*.exe" | Select-Object -First 1).FullName
          if (!$qtpaths) { throw "qtpaths not found in the pixi env" }
          pixi run windeployqt6 --qtpaths "$qtpaths" --release --no-translations --no-system-d3d-compiler dist/penzene/penzene.exe
          if (!(Test-Path dist/penzene/platforms/qwindows.dll)) { throw "windeployqt did not bundle the platform plugin" }
          if (!(Test-Path dist/penzene/tls)) { throw "windeployqt did not bundle a TLS backend" }
          pixi run pwsh -NoProfile -File cmake/deploy-deps.ps1 -Dest "$PWD/dist/penzene" -Search "$PWD/rdkit-prefix/lib;$PWD/.pixi/envs/default/Library/bin"
          if (Get-ChildItem dist/penzene -Recurse -Filter "*chemdraw*") { throw "RDKit's ChemDraw library is in the package (#233)" }
      - name: Sign penzene.exe
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          & $signtool sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist/penzene/penzene.exe
          if ($LASTEXITCODE) { throw "signtool sign failed" }
          Remove-Item $pfx
          & $signtool verify /pa dist/penzene/penzene.exe
          if ($LASTEXITCODE) { throw "signtool verify failed" }
      - name: Smoke test and zip
        shell: pwsh
        run: |
          Rename-Item .pixi .pixi-hidden
          dist/penzene/penzene.exe --version
          $p = Start-Process dist/penzene/penzene.exe -ArgumentList "--render","c1ccccc1O","smoke.svg" -NoNewWindow -PassThru
          if (!$p.WaitForExit(120000)) { $p.Kill(); throw "packaged app hung" }
          if (!(Test-Path smoke.svg)) { throw "packaged app failed to render" }
          Rename-Item .pixi-hidden .pixi
          Compress-Archive dist/penzene penzene-windows-x64.zip
      - name: Installer
        shell: pwsh
        run: |
          # penzene.exe is a GUI-subsystem app, so pwsh can't capture its --version output.
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(penzene VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" /Q "/DVersion=$version" "/DSource=$PWD\dist\penzene" cmake/penzene.iss
          if ($LASTEXITCODE) { throw "iscc failed" }
          Move-Item cmake/penzene-windows-x64-setup.exe .
      - name: Sign the installer
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          & $signtool sign /f $pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 penzene-windows-x64-setup.exe
          if ($LASTEXITCODE) { throw "signtool sign failed" }
          Remove-Item $pfx
          & $signtool verify /pa penzene-windows-x64-setup.exe
          if ($LASTEXITCODE) { throw "signtool verify failed" }
      - name: Test the installer
        shell: pwsh
        run: |
          # Silent install to a temp dir, then run the installed copy.
          $p = Start-Process ./penzene-windows-x64-setup.exe -ArgumentList "/VERYSILENT","/CURRENTUSER","/DIR=$PWD\installed" -PassThru
          if (!$p.WaitForExit(300000)) { throw "installer hung" }
          if (!(Test-Path installed/penzene.exe)) { throw "installer did not install penzene.exe" }
          if (!(Test-Path installed/LICENSE) -or !(Test-Path installed/THIRD_PARTY_LICENSES.md)) { throw "installer omitted license notices" }
          $p = Start-Process installed/penzene.exe -ArgumentList "--render","c1ccccc1O","installed.svg" -NoNewWindow -PassThru
          if (!$p.WaitForExit(120000)) { $p.Kill(); throw "installed app hung" }
          if (!(Test-Path installed.svg)) { throw "installed app failed to render" }
      - uses: actions/upload-artifact@v4
        with: {name: windows, path: "penzene-windows-x64*"}

  linux:
    runs-on: ubuntu-22.04   # older glibc base = runs on more distros
    timeout-minutes: 150   # 45 once RDKit comes from the cache
    env: {RDKit_ROOT: '${{ github.workspace }}/rdkit-prefix'}
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y libfuse2 libxkbcommon-x11-0 libxcb-cursor0 libegl1 libgl1 libfontconfig1 xvfb
      - uses: prefix-dev/setup-pixi@v0.10.0
        with: {cache: true}
      - uses: actions/cache@v4   # RDKit without its ChemDraw library (#233); see rdkit.yml
        id: rdkit
        with:
          path: rdkit-prefix
          key: rdkit-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('cmake/build-rdkit.sh', 'pixi.lock') }}
      - if: steps.rdkit.outputs.cache-hit != 'true'
        shell: bash
        run: pixi run bash cmake/build-rdkit.sh rdkit-prefix
      - run: pixi run build
      - name: AppImage
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage
          cat > penzene.desktop <<'DESK'
          [Desktop Entry]
          Type=Application
          Name=Penzene
          Exec=penzene
          Icon=penzene
          Categories=Science;Chemistry;Education;
          DESK
          QT_QPA_PLATFORM=offscreen build/bin/penzene --render 'c1ccccc1' penzene.svg
          env="$PWD/.pixi/envs/default"
          mkdir -p AppDir/usr/share/licenses/penzene
          cp LICENSE THIRD_PARTY_LICENSES.md AppDir/usr/share/licenses/penzene/
          QMAKE="$env/bin/qmake6" LD_LIBRARY_PATH="$PWD/rdkit-prefix/lib:$env/lib" \
            ./linuxdeploy-x86_64.AppImage --appdir AppDir -e build/bin/penzene \
            -d penzene.desktop -i penzene.svg --plugin qt --output appimage \
            -l "$env/lib/libstdc++.so.6" -l "$env/lib/libgcc_s.so.1"  # conda-built, newer than the host's
          mv Penzene*.AppImage penzene-linux-x86_64.AppImage
          test -d AppDir/usr/plugins/tls   # HTTPS for the PubChem lookups
          test -s AppDir/usr/share/licenses/penzene/THIRD_PARTY_LICENSES.md
          bash cmake/check-no-chemdraw.sh AppDir penzene-linux-x86_64.AppImage
          mv .pixi .pixi-hidden
          xvfb-run -a ./penzene-linux-x86_64.AppImage --render 'c1ccccc1O' smoke.svg
          test -s smoke.svg
          mv .pixi-hidden .pixi
      - uses: actions/upload-artifact@v4
        with: {name: linux, path: penzene-linux-x86_64.AppImage}

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5   # the release notes come from CHANGELOG.md
        with: {path: notes, sparse-checkout: "CHANGELOG.md\ncmake/release-notes.py", sparse-checkout-cone-mode: false}
      - uses: actions/download-artifact@v4
        with: {merge-multiple: true}
      - run: |
          # Both workflows get here on a tag; whichever is second finds the release made.
          python3 notes/cmake/release-notes.py "$GITHUB_REF_NAME" notes/CHANGELOG.md > notes.md  # fails without notes
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md 2>/dev/null ||
            gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber *.dmg *.zip *.exe *.AppImage
        env: {GH_TOKEN: '${{ github.token }}'}
