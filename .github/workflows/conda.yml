# The conda-forge recipe, built as staged-recipes would build it (rattler-build, conda-forge's own
# RDKit and Qt), and its tests run. Runs when the recipe changes, or by hand.
name: conda

on:
  pull_request:
    paths: [packaging/conda-forge/**, .github/workflows/conda.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          recipe-path: packaging/conda-forge/recipe.yaml
          upload-artifact: false
          build-args: -c conda-forge -m packaging/conda-forge/variants.yaml
