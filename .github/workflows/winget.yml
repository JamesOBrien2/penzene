# The winget manifests, rendered for a release and checked with winget validate on Windows.
# Runs when they change, or by hand for a release.
name: winget

on:
  pull_request:
    paths: [packaging/winget/**, .github/workflows/winget.yml]
  workflow_dispatch:
    inputs:
      version:
        description: Release to check (e.g. 1.9.0); the latest when empty
        required: false

permissions:
  contents: read

jobs:
  manifest:
    runs-on: windows-2025
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Render the manifests
        shell: pwsh
        run: |
          if (-not $env:VERSION) {
            $env:VERSION = (Invoke-RestMethod https://api.github.com/repos/JamesOBrien2/penzene/releases/latest).tag_name.TrimStart('v')
          }
          "VERSION=$env:VERSION" >> $env:GITHUB_ENV
          python packaging/winget/render.py $env:VERSION out
      - name: WinGet
        shell: pwsh
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Install-PackageProvider -Name NuGet -Force | Out-Null
            Install-Module Microsoft.WinGet.Client -Force -Repository PSGallery
            Repair-WinGetPackageManager -AllUsers -Latest
          }
          winget --version
      - name: Validate
        shell: pwsh
        run: |
          # An install isn't tested here: winget marks the download as from the internet, and Windows
          # holds an unsigned installer at a publisher prompt a runner can't answer. The release
          # workflow installs the same setup.exe silently, and winget-pkgs installs it on review.
          winget validate --manifest "out/manifests/j/JamesOBrien2/Penzene/$env:VERSION" --disable-interactivity
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
