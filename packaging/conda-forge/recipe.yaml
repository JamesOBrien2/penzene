# conda-forge recipe (rattler-build), for a pull request to conda-forge/staged-recipes
# as recipes/penzene/recipe.yaml. Builds the Python module against conda-forge's own
# RDKit and Qt, so it shares them with the rest of the environment.
context:
  version: "1.9.0"

package:
  name: penzene
  version: ${{ version }}

source:
  url: https://github.com/JamesOBrien2/penzene/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 8e4d21e1f866946e2bcf5ad27f5095628ba8e1c752f83c4a8107f25f3bef5353

build:
  number: 0
  skip: match(python, "<3.12")
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake >=3.28
    - ninja
  host:
    - python
    - pip
    - cmake >=3.28  # scikit-build-core looks for these in the host environment
    - ninja
    - scikit-build-core >=0.10
    - nanobind >=2.4
    - librdkit-dev
    - libboost-devel
    - expat  # the vendored ChemDraw file library parses CDXML with it
    - qt6-main >=6.8
  run:
    - python
    - librdkit  # librdkit-dev brings no run_exports for the runtime libraries

tests:
  - python:
      imports:
        - penzene
  - script:
      - python -c "import os; os.environ.setdefault('QT_QPA_PLATFORM', 'offscreen'); import penzene as pz; d = pz.from_smiles('CC(=O)Oc1ccccc1C(=O)O'); assert d.formula == 'C9H8O4'; assert d.to_svg().startswith('<?xml')"
    requirements:
      run:
        - python

about:
  homepage: https://github.com/JamesOBrien2/penzene
  documentation: https://penzene.readthedocs.io
  summary: Publication-quality 2D chemical structures from Python, drawn by the Penzene engine
  description: |
    Draw, convert and render 2D chemical structures with the same engine as the Penzene
    desktop app: SMILES, MOL, InChI and ChemDraw CDXML in; SVG, PNG and PDF out, in
    ACS, RSC or JDP style.
  license: GPL-3.0-or-later
  license_file:
    - LICENSE
    - THIRD_PARTY_LICENSES.md
    - third_party/chemdraw/chemdraw/license.txt  # the ChemDraw file library, built in statically

extra:
  recipe-maintainers:
    - JamesOBrien2
